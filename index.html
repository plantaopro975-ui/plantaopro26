    <style>
      /* Fundo do tema aplicado imediatamente (antes do CSS carregar)
         para eliminar flash preto durante o boot. Espelha o radial
         do splash "Boot Tático" definido em src/index.css. */
      html, body, #root {
        background-color: #050505;
        background-image: radial-gradient(ellipse 90% 60% at 50% 45%, #0A1128 0%, #060912 60%, #050505 100%);
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: cover;
      }
      /* Trava a altura no mobile para evitar redimensionamento quando a barra de endereço aparece/some */
      @media (max-width: 767px) {
        html, body {
          height: 100dvh;
          min-height: 100dvh;
          max-height: 100dvh;
          overflow: hidden;
          overscroll-behavior: none;
          position: fixed;
          inset: 0;
          width: 100%;
          touch-action: pan-y pinch-zoom;
        }
        #root {
          height: 100dvh;
          max-height: 100dvh;
          overflow: hidden;
        }
      }
      @media (min-width: 768px) {
        html, body, #root { min-height: 100vh; }
      }
    </style>
