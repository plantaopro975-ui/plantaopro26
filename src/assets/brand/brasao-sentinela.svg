<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PlantãoPro — Brasão Sentinela">
  <title>PlantãoPro — Brasão Sentinela</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E29A"/>
      <stop offset="35%" stop-color="#E7C15A"/>
      <stop offset="65%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8A6A20"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B8"/>
      <stop offset="50%" stop-color="#D4A93B"/>
      <stop offset="100%" stop-color="#6B4E12"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2540"/>
      <stop offset="100%" stop-color="#070B18"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <symbol id="feather" viewBox="-6 -20 12 40">
      <path d="M0 -20 C 5 -12, 5 8, 0 20 C -5 8, -5 -12, 0 -20 Z" fill="url(#gold)" stroke="#5A4212" stroke-width="0.6"/>
      <path d="M0 -18 L 0 18" stroke="#8A6A20" stroke-width="0.5" opacity="0.7"/>
    </symbol>
  </defs>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="248" fill="url(#shine)"/>

  <!-- ===== Shield ===== -->
  <g transform="translate(256 330)">
    <!-- Shield body -->
    <path d="M -128 -70
             C -128 -95, -110 -100, -90 -100
             L 90 -100
             C 110 -100, 128 -95, 128 -70
             L 128 40
             C 128 100, 70 150, 0 175
             C -70 150, -128 100, -128 40 Z"
          fill="url(#shieldBg)" stroke="url(#goldEdge)" stroke-width="6"/>
    <!-- Inner bevel -->
    <path d="M -114 -66
             C -114 -88, -100 -90, -84 -90
             L 84 -90
             C 100 -90, 114 -88, 114 -66
             L 114 38
             C 114 92, 62 138, 0 160
             C -62 138, -114 92, -114 38 Z"
          fill="none" stroke="#3A2F10" stroke-width="1.2" opacity="0.9"/>

    <!-- Carbon-fiber diagonal texture -->
    <g opacity="0.18" clip-path="inset(0)">
      <g stroke="#7FA0FF" stroke-width="0.6">
        <path d="M-140 -60 L 140 -60" transform="rotate(0)"/>
      </g>
    </g>

    <!-- Chevrons -->
    <g fill="url(#gold)" stroke="#5A4212" stroke-width="1.2" stroke-linejoin="round">
      <path d="M -55 -30 L 0 -60 L 55 -30 L 40 -22 L 0 -44 L -40 -22 Z"/>
      <path d="M -55 5   L 0 -25 L 55 5   L 40 13  L 0 -9  L -40 13  Z"/>
      <path d="M -55 40  L 0 10  L 55 40  L 40 48  L 0 26  L -40 48  Z"/>
    </g>

    <!-- Star -->
    <path d="M 0 92 L 6 108 L 23 108 L 9 118 L 14 134 L 0 124 L -14 134 L -9 118 L -23 108 L -6 108 Z"
          fill="url(#gold)" stroke="#5A4212" stroke-width="0.8"/>

    <!-- Laurels -->
    <g stroke="#5A4212" stroke-width="0.6" fill="url(#gold)" opacity="0.95">
      <g transform="translate(-118 20)">
        <path d="M0 0 C -18 -20, -22 -50, -10 -80" fill="none" stroke="url(#goldEdge)" stroke-width="3"/>
        <g transform="translate(-4 -10) rotate(-20)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
        <g transform="translate(-8 -28) rotate(-30)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
        <g transform="translate(-10 -46) rotate(-40)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
        <g transform="translate(-10 -64) rotate(-50)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
      </g>
      <g transform="translate(118 20) scale(-1 1)">
        <path d="M0 0 C -18 -20, -22 -50, -10 -80" fill="none" stroke="url(#goldEdge)" stroke-width="3"/>
        <g transform="translate(-4 -10) rotate(-20)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
        <g transform="translate(-8 -28) rotate(-30)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
        <g transform="translate(-10 -46) rotate(-40)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
        <g transform="translate(-10 -64) rotate(-50)"><ellipse cx="-6" cy="0" rx="7" ry="3"/></g>
      </g>
    </g>
  </g>

  <!-- ===== Eagle ===== -->
  <g transform="translate(256 190)">
    <!-- Left wing -->
    <g transform="translate(-30 -10)">
      <use href="#feather" x="-20"  y="10" transform="rotate(-70 -20 10) scale(1.4 1.9)"/>
      <use href="#feather" x="-40"  y="0"  transform="rotate(-80 -40 0)  scale(1.5 2.1)"/>
      <use href="#feather" x="-60"  y="-6" transform="rotate(-88 -60 -6) scale(1.6 2.2)"/>
      <use href="#feather" x="-80"  y="-8" transform="rotate(-96 -80 -8) scale(1.65 2.3)"/>
      <use href="#feather" x="-100" y="-6" transform="rotate(-104 -100 -6) scale(1.6 2.2)"/>
      <use href="#feather" x="-118" y="2"  transform="rotate(-112 -118 2) scale(1.5 2.0)"/>
      <use href="#feather" x="-132" y="14" transform="rotate(-120 -132 14) scale(1.35 1.8)"/>
    </g>
    <!-- Right wing (mirror) -->
    <g transform="translate(30 -10) scale(-1 1)">
      <use href="#feather" x="-20"  y="10" transform="rotate(-70 -20 10) scale(1.4 1.9)"/>
      <use href="#feather" x="-40"  y="0"  transform="rotate(-80 -40 0)  scale(1.5 2.1)"/>
      <use href="#feather" x="-60"  y="-6" transform="rotate(-88 -60 -6) scale(1.6 2.2)"/>
      <use href="#feather" x="-80"  y="-8" transform="rotate(-96 -80 -8) scale(1.65 2.3)"/>
      <use href="#feather" x="-100" y="-6" transform="rotate(-104 -100 -6) scale(1.6 2.2)"/>
      <use href="#feather" x="-118" y="2"  transform="rotate(-112 -118 2) scale(1.5 2.0)"/>
      <use href="#feather" x="-132" y="14" transform="rotate(-120 -132 14) scale(1.35 1.8)"/>
    </g>

    <!-- Body -->
    <path d="M -22 10
             C -30 40, -18 70, 0 78
             C 18 70, 30 40, 22 10
             C 16 -6, -16 -6, -22 10 Z"
          fill="url(#gold)" stroke="#5A4212" stroke-width="1.2"/>
    <!-- Feather scales on chest -->
    <g fill="none" stroke="#5A4212" stroke-width="0.6" opacity="0.7">
      <path d="M -18 20 Q 0 30 18 20"/>
      <path d="M -16 34 Q 0 44 16 34"/>
      <path d="M -14 48 Q 0 58 14 48"/>
      <path d="M -10 62 Q 0 70 10 62"/>
    </g>

    <!-- Head (profile facing left) -->
    <g transform="translate(0 -14)">
      <path d="M -14 0
               C -14 -22, 6 -30, 18 -22
               C 26 -16, 26 -4, 20 4
               C 14 12, -2 14, -14 8 Z"
            fill="url(#gold)" stroke="#5A4212" stroke-width="1.2"/>
      <!-- Beak -->
      <path d="M 20 -6 L 42 -2 L 34 4 L 22 4 Z" fill="url(#goldEdge)" stroke="#3A2A08" stroke-width="1"/>
      <path d="M 22 3 L 34 3" stroke="#3A2A08" stroke-width="0.8"/>
      <!-- Eye -->
      <circle cx="10" cy="-10" r="2.6" fill="#1a1204"/>
      <circle cx="10.7" cy="-10.7" r="0.8" fill="#FFF3B8"/>
      <!-- Brow -->
      <path d="M 2 -16 Q 12 -20 22 -14" fill="none" stroke="#5A4212" stroke-width="1.2"/>
    </g>

    <!-- Talons -->
    <g stroke="#3A2A08" stroke-width="1" fill="url(#goldEdge)">
      <path d="M -14 76 L -18 92 L -12 90 L -10 78 Z"/>
      <path d="M  14 76 L  18 92 L  12 90 L  10 78 Z"/>
      <path d="M  -4 80 L  -6 96 L   0 94 L   2 82 Z"/>
    </g>
  </g>

  <!-- ===== Banner ===== -->
  <g transform="translate(256 430)">
    <path d="M -160 0
             C -140 -18, 140 -18, 160 0
             L 150 30
             C 130 14, -130 14, -150 30 Z"
          fill="url(#shieldBg)" stroke="url(#goldEdge)" stroke-width="3"/>
    <path d="M -170 6 L -160 0 L -150 30 L -166 32 Z" fill="#0B1226" stroke="url(#goldEdge)" stroke-width="2"/>
    <path d="M  170 6 L  160 0 L  150 30 L  166 32 Z" fill="#0B1226" stroke="url(#goldEdge)" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="700" font-size="22" letter-spacing="4"
          fill="url(#gold)" stroke="#5A4212" stroke-width="0.6">PLANTÃO PRO</text>
  </g>

  <!-- Global soft highlight -->
  <ellipse cx="256" cy="150" rx="200" ry="60" fill="url(#shine)" opacity="0.6"/>
</svg>
